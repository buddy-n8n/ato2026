name: ato-demo
x-n8n: &n8n
  image: n8nio/n8n:2.43.7
  restart: unless-stopped
  environment: &env
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: ${PG_PASSWORD}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_METRICS: "true"
    N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
    N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    N8N_WORKER_SERVER_ADDRESS: "0.0.0.0"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    N8N_LOG_LEVEL: info
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_SECURE_COOKIE: "false"
    GENERIC_TIMEZONE: America/New_York
  depends_on: [postgres, redis]
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: n8n, POSTGRES_PASSWORD: "${PG_PASSWORD}", POSTGRES_DB: n8n}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  n8n:
    <<: *n8n
    environment:
      <<: *env
      # create the owner account from env vars: no setup screen
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${OWNER_EMAIL}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${OWNER_FIRST_NAME}
      N8N_INSTANCE_OWNER_LAST_NAME: ${OWNER_LAST_NAME}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH}
    ports: ["127.0.0.1:5678:5678"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
  import:
    # one-shot: loads the demo workflows once n8n is healthy, then exits.
    # Skips workflows already in the database so re-running `up` keeps your edits (e.g. the credential link).
    <<: *n8n
    entrypoint: ["sh", "-c"]
    command:
      - |
        existing=$$(n8n list:workflow --onlyId)
        for f in /workflows/*.json; do
          id=$$(sed -n 's/^  "id": "\(.*\)",$$/\1/p' $$f)
          if echo "$$existing" | grep -qx "$$id"; then echo "Skipping $$f (already imported)"
          else n8n import:workflow --input=$$f; fi
        done
    restart: "no"
    volumes: ["./workflows:/workflows:ro"]
    depends_on:
      n8n: {condition: service_healthy}
  worker1:
    <<: *n8n
    command: worker
  worker2:
    <<: *n8n
    command: worker
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes: ["./prom/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata: {}
